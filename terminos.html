<style>
:root{--ink:#0B0A09;--ink-2:#131110;--ink-3:#1C1917;--ink-4:#262220;--brass:#C6A15B;--brass-hi:#E7CE95;
  --jade:#0F504C;--jade-hi:#63B0A9;--bone:#F2EDE3;--muted:#9C9287;--muted-2:#6E665D;--danger:#C25B4A;
  --f-display:"Bodoni Moda",'Times New Roman',serif;--f-body:"Barlow",system-ui,sans-serif;--f-cond:"Barlow Condensed","Barlow",sans-serif;--r:3px}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}

ul{margin:0 0 12px 18px;padding:0}li{margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border:1px solid var(--brass);border-radius:var(--r);

.num{display:block;font-family:var(--f-display);font-size:2.2rem;color:var(--brass-hi);margin:4px 0 8px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0;font-size:.95rem}

const T = {"es": {"title": "Términos y privacidad — Tropical Experts Costa Rica", "body": "\n<p class=\"eyebrow\">Términos y condiciones · Política de privacidad</p>\n<h1>Condiciones del servicio de Tropical Experts Costa Rica</h1>\n<p class=\"muted\">Última actualización: septiembre de 2026. Al reservar en esta página usted acepta estas condiciones.</p>\n\n<h2>1. Quiénes somos</h2>\n<p>Tropical Experts Costa Rica es una empresa familiar de transporte turístico privado con sede en La Fortuna, San Carlos, Alajuela, Costa Rica, representada por <b>Carlos Johnnson Paniagua Berrocal</b> · Cédula 4-0188-0497. Operamos con Licencia I.C.T. #3946-2025 (Instituto Costarricense de Turismo) y seguros de responsabilidad vigentes. Contacto: WhatsApp +506 8486 7057 · teléfono +506 8762 4779 · tropicalexpertscr@gmail.com · tropicalexpertscostarica.com.</p>\n\n<h2>2. El servicio</h2>\n<p>Traslados privados puerta a puerta en vehículo exclusivo para su grupo. El precio es <b>por vehículo, no por persona</b>, en dólares estadounidenses (USD), e incluye conductor profesional, combustible, peajes, impuestos (IVA), seguro, agua, WiFi a bordo y sillas para niños. No hay cargos ocultos ni pagos al conductor.</p>\n<ul>\n  <li><b>Estándar:</b> viaje directo, sin paradas turísticas (pausas cortas de baño o para estirar las piernas sí están incluidas).</li>\n  <li><b>Tropical Experts VIP:</b> incluye de 1 a 2 horas de paradas turísticas, chofer profesional bilingüe garantizado y kit de bienvenida. Cada hora adicional de paradas tiene el costo indicado al reservar (máximo 4).</li>\n  <li>Capacidad: Hyundai Staria hasta 5 pasajeros, Toyota Hiace hasta 9, Maxus V90 hasta 12. Cada pasajero puede llevar una maleta grande y un bolso de mano; equipo especial (tablas de surf, bicicletas, equipo de buceo) debe confirmarse al reservar.</li>\n</ul>\n\n<h2>3. Reserva y pago</h2>\n<p>Al completar el formulario se crea su número de orden (TECR-###) y pasa a la <b>plataforma segura de Tilopay</b> para pagar el total con tarjeta Visa, Mastercard o American Express. La reserva queda confirmada cuando Tilopay aprueba el pago; entonces recibe por correo su comprobante en PDF.</p>\n<ul>\n  <li>El cobro se hace en USD. Su banco aplica el tipo de cambio del día y puede cobrar una comisión por transacción internacional; esa comisión la fija su banco, no nosotros.</li>\n  <li>Sus datos de tarjeta nunca pasan por nuestra página ni los conocemos: los recibe y procesa Tilopay, pasarela certificada PCI DSS con verificación 3-D Secure. El cargo aparece en su estado de cuenta a nombre de Tropical Experts Costa Rica.</li>\n  <li>Si prefiere pagar por SINPE Móvil o transferencia bancaria, escríbanos por WhatsApp y le enviamos las instrucciones; la reserva se confirma al recibir el pago.</li>\n  <li>Este comprobante de reserva no sustituye la factura electrónica, que se emite por separado conforme a la normativa del Ministerio de Hacienda de Costa Rica.</li>\n</ul>\n\n<h2>4. Cancelaciones, cambios y devoluciones</h2>\n<ul>\n  <li><b>Con 48 horas o más de anticipación</b> a la hora de recogida: cancelación gratuita y devolución del 100 % de lo pagado, a la misma tarjeta. La devolución la procesa Tilopay y su banco puede tardar de 5 a 10 días hábiles en reflejarla.</li>\n  <li><b>Con menos de 48 horas</b>: no hay devolución, salvo cancelación del vuelo comprobada con el documento de la aerolínea.</li>\n  <li><b>No presentarse</b> (no-show) o no localizarse en el punto de recogida tras 60 minutos de espera y varios intentos de contacto: no hay devolución.</li>\n  <li>Cambios de fecha, hora o dirección: sin costo, sujetos a disponibilidad, solicitándolos por WhatsApp o correo.</li>\n  <li>Vuelos: monitoreamos su vuelo. Si se atrasa, ajustamos la recogida sin costo. Si la aerolínea lo cancela, reprogramamos su traslado a la nueva fecha sin cargo.</li>\n  <li>Si nosotros debemos cancelar (clima extremo, cierre de carretera, causa de fuerza mayor), le ofrecemos reprogramar o la devolución completa.</li>\n</ul>\n\n<h2>5. Responsabilidad</h2>\n<p>Nos comprometemos a un servicio puntual, seguro y cordial. No respondemos por pérdidas de conexiones o actividades derivadas de atrasos ajenos a nuestro control (tránsito, clima, cierres viales, retrasos de la aerolínea), ni por objetos olvidados en el vehículo, aunque siempre ayudamos a recuperarlos. Los pasajeros deben usar el cinturón de seguridad y las sillas para niños que exige la ley de Costa Rica.</p>\n\n<h2>6. Privacidad y datos personales</h2>\n<ul>\n  <li><b>Qué datos pedimos:</b> nombre, correo, WhatsApp, país y código postal de la tarjeta (los requiere Tilopay para verificar el pago), y los datos del viaje: fechas, horas, direcciones, número de vuelo, cantidad de pasajeros y sillas para niños.</li>\n  <li><b>Para qué:</b> únicamente para prestar el servicio, enviarle su comprobante y comunicarnos con usted sobre su reserva. No enviamos publicidad ni compartimos sus datos con terceros, salvo Tilopay para procesar el pago.</li>\n  <li><b>Dónde se guardan:</b> el registro de la orden (sin datos de tarjeta) se guarda en una hoja de cálculo privada de Google Workspace administrada por la empresa. La página web <b>no almacena</b> sus datos: al enviar la reserva, la información del viaje se borra de su navegador.</li>\n  <li><b>Datos de tarjeta:</b> nunca los recibimos. Los procesa Tilopay conforme al estándar PCI DSS.</li>\n  <li><b>Cuánto tiempo:</b> conservamos el registro de la reserva el tiempo que exige la legislación tributaria de Costa Rica; después se elimina o anonimiza. Puede pedirnos en cualquier momento ver, corregir o borrar sus datos escribiendo a tropicalexpertscr@gmail.com.</li>\n  <li><b>Cookies:</b> no usamos cookies de rastreo ni publicidad. La página guarda en su navegador solo su moneda preferida y los viajes que va agregando al carrito, hasta que envía la reserva. Usamos Google Fonts para la tipografía.</li>\n</ul>\n\n<h2>7. Contacto</h2>\n<p>Tropical Experts Costa Rica · Carlos Johnnson Paniagua Berrocal · Cédula 4-0188-0497<br>La Fortuna, San Carlos, Alajuela, Costa Rica<br>WhatsApp +506 8486 7057 · Teléfono +506 8762 4779 · tropicalexpertscr@gmail.com<br>tropicalexpertscostarica.com · Atención 24/7</p>\n"}, "en": {"title": "Terms & privacy — Tropical Experts Costa Rica", "body": "\n<p class=\"eyebrow\">Terms and conditions · Privacy policy</p>\n<h1>Terms of service of Tropical Experts Costa Rica</h1>\n<p class=\"muted\">Last updated: September 2026. By booking on this site you accept these terms.</p>\n\n<h2>1. Who we are</h2>\n<p>Tropical Experts Costa Rica is a family-run private tourist transport company based in La Fortuna, San Carlos, Alajuela, Costa Rica, represented by <b>Carlos Johnnson Paniagua Berrocal</b> · ID 4-0188-0497. We operate under Licencia I.C.T. #3946-2025 (Costa Rican Tourism Board) with valid liability insurance. Contact: WhatsApp +506 8486 7057 · phone +506 8762 4779 · tropicalexpertscr@gmail.com · tropicalexpertscostarica.com.</p>\n\n<h2>2. The service</h2>\n<p>Private door-to-door transfers in a vehicle exclusively for your group. The price is <b>per vehicle, not per person</b>, in US dollars (USD), and includes a professional driver, fuel, tolls, taxes (VAT), insurance, water, onboard WiFi and child seats. No hidden fees and nothing to pay the driver.</p>\n<ul>\n  <li><b>Standard:</b> direct trip, no sightseeing stops (short restroom or stretch breaks are included).</li>\n  <li><b>Tropical Experts VIP:</b> includes 1 to 2 hours of sightseeing stops, a guaranteed bilingual professional driver and a welcome kit. Each extra hour of stops costs the amount shown when booking (maximum 4).</li>\n  <li>Capacity: Hyundai Staria up to 5 passengers, Toyota Hiace up to 9, Maxus V90 up to 12. Each passenger may bring one large suitcase and one carry-on; special equipment (surfboards, bicycles, diving gear) must be confirmed when booking.</li>\n</ul>\n\n<h2>3. Booking and payment</h2>\n<p>When you complete the form, your order number (TECR-###) is created and you go to <b>Tilopay's secure platform</b> to pay the full amount by Visa, Mastercard or American Express. The booking is confirmed once Tilopay approves the payment; you then receive your PDF voucher by email.</p>\n<ul>\n  <li>You are charged in USD. Your bank applies the day's exchange rate and may add an international transaction fee; that fee is set by your bank, not by us.</li>\n  <li>Your card details never pass through our site and we never see them: they are received and processed by Tilopay, a PCI DSS-certified gateway with 3-D Secure verification. The charge appears on your statement as Tropical Experts Costa Rica.</li>\n  <li>If you prefer SINPE Móvil or a bank transfer, message us on WhatsApp for instructions; the booking is confirmed when the payment is received.</li>\n  <li>The booking voucher is not an electronic invoice; invoices are issued separately under the rules of Costa Rica's Ministry of Finance.</li>\n</ul>\n\n<h2>4. Cancellations, changes and refunds</h2>\n<ul>\n  <li><b>48 hours or more before</b> the pick-up time: free cancellation and a 100 % refund to the same card. Refunds are processed by Tilopay and your bank may take 5–10 business days to show them.</li>\n  <li><b>Less than 48 hours before</b>: non-refundable, except for a flight cancellation documented by the airline.</li>\n  <li><b>No-show</b>, or not reachable at the pick-up point after 60 minutes of waiting and several contact attempts: non-refundable.</li>\n  <li>Changes of date, time or address: free of charge, subject to availability, requested by WhatsApp or email.</li>\n  <li>Flights: we track your flight. If it is delayed, we adjust the pick-up at no cost. If the airline cancels it, we reschedule your transfer to the new date at no charge.</li>\n  <li>If we must cancel (extreme weather, road closure, force majeure), we offer to reschedule or a full refund.</li>\n</ul>\n\n<h2>5. Liability</h2>\n<p>We commit to a punctual, safe and friendly service. We are not liable for missed connections or activities caused by delays beyond our control (traffic, weather, road closures, airline delays), nor for items left in the vehicle, although we always help recover them. Passengers must wear seat belts and use the child seats required by Costa Rican law.</p>\n\n<h2>6. Privacy and personal data</h2>\n<ul>\n  <li><b>What we ask for:</b> name, email, WhatsApp, card country and postal code (required by Tilopay to verify the payment), and your trip details: dates, times, addresses, flight number, number of passengers and child seats.</li>\n  <li><b>What for:</b> only to provide the service, send your voucher and contact you about your booking. We do not send advertising or share your data with third parties, except Tilopay to process the payment.</li>\n  <li><b>Where it is stored:</b> the order record (never card data) is kept in a private Google Workspace spreadsheet managed by the company. The website itself <b>does not store</b> your data: once you send the booking, the trip details are cleared from your browser.</li>\n  <li><b>Card data:</b> we never receive it. It is processed by Tilopay under the PCI DSS standard.</li>\n  <li><b>How long:</b> we keep the booking record for as long as Costa Rican tax law requires; then it is deleted or anonymised. You may ask to see, correct or delete your data at any time by writing to tropicalexpertscr@gmail.com.</li>\n  <li><b>Cookies:</b> we use no tracking or advertising cookies. The site stores in your browser only your preferred currency and the trips you add to the cart, until you send the booking. We use Google Fonts for typography.</li>\n</ul>\n\n<h2>7. Contact</h2>\n<p>Tropical Experts Costa Rica · Carlos Johnnson Paniagua Berrocal · ID 4-0188-0497<br>La Fortuna, San Carlos, Alajuela, Costa Rica<br>WhatsApp +506 8486 7057 · Phone +506 8762 4779 · tropicalexpertscr@gmail.com<br>tropicalexpertscostarica.com · 24/7 support</p>\n"}};
let LANG = "en";                       /* la página abre en inglés */
function setLang(l){
  LANG = l; document.documentElement.lang = l;
  try{ localStorage.setItem("te_lang", l); }catch(e){}
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.getAttribute("data-t"); if(T[l][k] != null) el.innerHTML = T[l][k]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  document.title = T[l].title;
  if(typeof onLang === "function") onLang();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
const q = new URLSearchParams(location.search);
let l0 = q.get("lang") || "";
if(!l0){ try{ l0 = JSON.parse(atob((q.get("returnData")||"").replace(/-/g,"+").replace(/_/g,"/"))).l || ""; }catch(e){} }
/* Orden: lo que diga la dirección → el idioma con que reservó → lo que el
   visitante escogió antes en el sitio → inglés, que es el de entrada. */
if(!l0){ try{ l0 = localStorage.getItem("te_lang") || ""; }catch(e){} }
setLang(l0 === "es" ? "es" : "en");

</script>
