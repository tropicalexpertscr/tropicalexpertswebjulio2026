<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<title>Resultado del pago — Tropical Experts Costa Rica</title>
<link rel="icon" href="img/logo-te.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0A09">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
:root{--ink:#0B0A09;--ink-2:#131110;--ink-3:#1C1917;--ink-4:#262220;--brass:#C6A15B;--brass-hi:#E7CE95;
  --jade:#0F504C;--jade-hi:#63B0A9;--bone:#F2EDE3;--muted:#9C9287;--muted-2:#6E665D;--danger:#C25B4A;
  --f-display:"Bodoni Moda",'Times New Roman',serif;--f-body:"Barlow",system-ui,sans-serif;--f-cond:"Barlow Condensed","Barlow",sans-serif;--r:3px}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--brass-hi);text-decoration:none}
a:hover{color:var(--brass)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--ink-4);background:var(--ink-2)}
.hdr img{width:46px;height:auto}
.hdr .brand{display:flex;align-items:center;gap:12px;color:var(--bone)}
.hdr .brand b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;letter-spacing:.02em}
.lang{display:flex;border:1px solid var(--ink-4);border-radius:var(--r);overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font:inherit;font-family:var(--f-cond);font-size:.82rem;letter-spacing:.14em;padding:7px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--brass);color:var(--ink)}
.wrap{max-width:820px;margin-inline:auto;padding:clamp(36px,6vw,72px) 24px 80px}
.eyebrow{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.22em;font-size:.78rem;color:var(--brass);margin:0 0 14px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,4.4vw,2.9rem);line-height:1.1;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:38px 0 8px;color:var(--brass-hi)}
p{margin:0 0 12px;color:var(--bone)}
.muted{color:var(--muted)}
ul{margin:0 0 12px 18px;padding:0}li{margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border:1px solid var(--brass);border-radius:var(--r);
  font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.16em;font-size:.86rem;font-weight:500;color:var(--brass-hi);cursor:pointer;background:transparent}
.btn--solid{background:var(--brass);color:var(--ink)}
.btn--solid:hover{background:var(--brass-hi);color:var(--ink)}
.btn--wa{background:#25D366;border-color:#25D366;color:#062B1A}
.btn--wa:hover{background:#3BE27A;color:#062B1A}
.box{margin:22px 0;padding:22px 24px;border:1px solid var(--brass);border-radius:var(--r);background:rgba(198,161,91,.08)}
.box--ok{border-color:rgba(99,176,169,.6);background:rgba(15,80,76,.18)}
.box--bad{border-color:rgba(194,91,74,.6);background:rgba(194,91,74,.10)}
.lbl{display:block;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.18em;font-size:.74rem;color:var(--brass)}
.num{display:block;font-family:var(--f-display);font-size:2.2rem;color:var(--brass-hi);margin:4px 0 8px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0;font-size:.95rem}
dt{color:var(--muted)}dd{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.field label{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;color:var(--muted)}
.field input{background:var(--ink-3);border:1px solid var(--ink-4);border-radius:var(--r);padding:12px 14px;color:var(--bone);font:inherit}
.field input:focus{border-color:var(--brass);outline:none}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--ink-4);font-size:.85rem;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:560px){dl{grid-template-columns:1fr;gap:2px}dt{margin-top:8px}}
</style>
</head>
<body>
<header class="hdr"><a class="brand" href="index.html" translate="no"><img src="img/logo-te.png" alt=""><b>Tropical Experts Costa Rica</b></a><div class="lang" role="group" aria-label="Idioma"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div></header>
<main class="wrap">
  
  <p class="eyebrow" data-t="eyebrow">Reserva</p>
  <h1 id="h1" data-t="h_wait">Revisando su pago…</h1>

  <div class="box box--ok" id="okBox" hidden>
    <span class="lbl" data-t="l_orden">Número de orden</span><b class="num" id="okOrden"></b>
    <dl><dt data-t="l_auth">Autorización</dt><dd id="okAuth">—</dd><dt data-t="l_tx">Transacción</dt><dd id="okTx">—</dd></dl>
    <p data-t="p_ok"></p>
    <p id="okEstado" class="muted"></p>
    <p data-t="p_ok2" class="muted"></p>
    <div class="acts"><a class="btn btn--wa" id="waOk" target="_blank" rel="noopener" data-t="wa">Escribirnos por WhatsApp</a><a class="btn" href="index.html" data-t="home">Volver al inicio</a></div>
  </div>

  <div class="box box--bad" id="badBox" hidden>
    <span class="lbl" data-t="l_orden">Número de orden</span><b class="num" id="badOrden"></b>
    <dl id="badDl"><dt data-t="l_desc">Detalle</dt><dd id="badDesc">—</dd></dl>
    <p data-t="p_bad"></p>
    <p data-t="p_bank" class="muted"></p>
    <div class="acts"><button type="button" class="btn btn--solid" id="retryBtn" data-t="retry">Intentar el pago de nuevo</button><a class="btn btn--wa" id="waBad" target="_blank" rel="noopener" data-t="wa">Escribirnos por WhatsApp</a></div>
    <div id="retryForm" hidden>
      <div class="field"><label for="retryMail" data-t="retry_mail">Correo con el que reservó</label><input type="email" id="retryMail" autocomplete="email"></div>
      <div class="acts"><button type="button" class="btn btn--solid" id="retryGo" data-t="retry_go">Generar nuevo enlace de pago</button></div>
      <p id="retryErr" class="muted" hidden data-t="retry_err"></p>
    </div>
  </div>

  <div class="box" id="noneBox" hidden>
    <p data-t="p_none"></p>
    <div class="acts"><a class="btn btn--solid" href="index.html" data-t="home">Volver al inicio</a></div>
  </div>

  <p class="foot" data-t="foot"></p>
</main>
<script>
const ENDPOINT = "", CLAVE = "tecr-2026-cr", WA = "50684867057";
const Q = new URLSearchParams(location.search);
const code = Q.get("code") || "", orden = (Q.get("order") || "").slice(0,20), auth = Q.get("auth") || "",
      tx = Q.get("tilopay-transaction") || Q.get("tpt") || "", desc = Q.get("description") || "";

const T = {"es": {"title": "Resultado del pago — Tropical Experts Costa Rica", "eyebrow": "Reserva", "h_wait": "Revisando su pago…", "h_ok": "¡Pago aprobado! Su reserva quedó confirmada.", "h_bad": "El pago no se completó", "h_none": "Confirmación de pago", "p_ok": "Gracias por reservar con Tropical Experts Costa Rica. Estamos enviando su comprobante en PDF al correo que indicó en la reserva; suele llegar en menos de dos minutos (revise también la carpeta de correo no deseado).", "p_ok2": "Un día antes del viaje le enviamos por WhatsApp o correo el nombre de su conductor, la placa del vehículo y el punto exacto de encuentro.", "p_sent": "Comprobante enviado a su correo.", "p_pend": "El pago fue aprobado por Tilopay. Si en unos minutos no recibe el comprobante, escríbanos por WhatsApp con su número de orden y se lo enviamos de inmediato.", "p_bad": "Su tarjeta no fue aprobada o el pago se canceló; no se hizo ningún cargo. Puede intentarlo de nuevo con la misma u otra tarjeta, o escribirnos por WhatsApp y le enviamos un enlace de pago alternativo.", "p_bank": "Algunos bancos de Estados Unidos, Canadá y Europa rechazan por seguridad los cobros desde Costa Rica: si es su caso, avise a su banco que autoriza el cobro a Tropical Experts Costa Rica e intente otra vez.", "p_none": "Esta página muestra el resultado del pago con tarjeta de una reserva. Si llegó aquí por error, vuelva al inicio para cotizar su traslado.", "l_orden": "Número de orden", "l_auth": "Autorización", "l_tx": "Transacción", "l_desc": "Detalle", "retry": "Intentar el pago de nuevo", "retry_mail": "Correo con el que reservó", "retry_go": "Generar nuevo enlace de pago", "retry_err": "No pudimos generar el enlace. Escríbanos por WhatsApp y lo resolvemos al momento.", "wa": "Escribirnos por WhatsApp", "home": "Volver al inicio", "wa_ok": "Hola, acabo de pagar mi reserva {o} en su página. ", "wa_bad": "Hola, intenté pagar mi reserva {o} pero el pago no se completó. ¿Me ayudan?", "foot": "Sus datos de tarjeta nunca pasan por esta página: los procesa Tilopay, pasarela certificada PCI DSS. El cobro aparece en su estado de cuenta a nombre de Tropical Experts Costa Rica."}, "en": {"title": "Payment result — Tropical Experts Costa Rica", "eyebrow": "Booking", "h_wait": "Checking your payment…", "h_ok": "Payment approved! Your booking is confirmed.", "h_bad": "The payment was not completed", "h_none": "Payment confirmation", "p_ok": "Thank you for booking with Tropical Experts Costa Rica. We are sending your PDF voucher to the email you gave in the booking; it usually arrives within two minutes (please check your spam folder too).", "p_ok2": "The day before your trip we send you, by WhatsApp or email, your driver's name, the vehicle's plate number and the exact meeting point.", "p_sent": "Voucher sent to your email.", "p_pend": "Tilopay approved the payment. If the voucher does not arrive within a few minutes, message us on WhatsApp with your order number and we will send it right away.", "p_bad": "Your card was not approved or the payment was cancelled; nothing was charged. You can try again with the same or another card, or message us on WhatsApp and we will send you an alternative payment link.", "p_bank": "Some banks in the United States, Canada and Europe block charges from Costa Rica as a fraud precaution: if that is your case, tell your bank you authorise the charge to Tropical Experts Costa Rica and try again.", "p_none": "This page shows the card-payment result of a booking. If you landed here by mistake, go back to the home page to get a quote.", "l_orden": "Order number", "l_auth": "Authorisation", "l_tx": "Transaction", "l_desc": "Detail", "retry": "Try the payment again", "retry_mail": "Email used in the booking", "retry_go": "Generate a new payment link", "retry_err": "We could not generate the link. Message us on WhatsApp and we will sort it out right away.", "wa": "Message us on WhatsApp", "home": "Back to home", "wa_ok": "Hi, I just paid my booking {o} on your website. ", "wa_bad": "Hi, I tried to pay my booking {o} but the payment did not go through. Can you help?", "foot": "Your card details never pass through this page: they are processed by Tilopay, a PCI DSS-certified gateway. The charge appears on your statement as Tropical Experts Costa Rica."}};
let LANG = "en";                       /* la página abre en inglés */
function setLang(l){
  LANG = l; document.documentElement.lang = l;
  try{ localStorage.setItem("te_lang", l); }catch(e){}
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.getAttribute("data-t"); if(T[l][k] != null) el.innerHTML = T[l][k]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  document.title = T[l].title;
  if(typeof onLang === "function") onLang();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
const q = new URLSearchParams(location.search);
let l0 = q.get("lang") || "";
if(!l0){ try{ l0 = JSON.parse(atob((q.get("returnData")||"").replace(/-/g,"+").replace(/_/g,"/"))).l || ""; }catch(e){} }
/* Orden: lo que diga la dirección → el idioma con que reservó → lo que el
   visitante escogió antes en el sitio → inglés, que es el de entrada. */
if(!l0){ try{ l0 = localStorage.getItem("te_lang") || ""; }catch(e){} }
setLang(l0 === "es" ? "es" : "en");

const esc = v => String(v==null?"":v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function wa(txt){ return "https://wa.me/" + WA + "?text=" + encodeURIComponent(txt); }
function onLang(){
  const t = T[LANG];
  if(orden){ document.getElementById("waOk").href = wa(t.wa_ok.replace("{o}", orden)); document.getElementById("waBad").href = wa(t.wa_bad.replace("{o}", orden)); }
  else { document.getElementById("waOk").href = wa(""); document.getElementById("waBad").href = wa(""); }
}
async function llamar(params){
  if(!ENDPOINT) throw new Error("sin servicio");
  const u = ENDPOINT + (ENDPOINT.includes("?") ? "&" : "?") + new URLSearchParams(Object.assign({clave: CLAVE}, params)).toString();
  const r = await fetch(u, {method:"GET"}); return r.json();
}
(async () => {
  const h1 = document.getElementById("h1");
  if(!orden){ h1.setAttribute("data-t","h_none"); h1.textContent = T[LANG].h_none; document.getElementById("noneBox").hidden = false; return; }
  onLang();
  if(code === "1"){
    h1.setAttribute("data-t","h_ok"); h1.textContent = T[LANG].h_ok;
    document.getElementById("okOrden").textContent = orden;
    document.getElementById("okAuth").textContent = auth || "—";
    document.getElementById("okTx").textContent = tx || "—";
    document.getElementById("okBox").hidden = false;
    /* El servicio de órdenes verifica el pago directamente con Tilopay y manda el comprobante. */
    const est = document.getElementById("okEstado");
    try{
      const j = await llamar({accion:"confirmar", orden: orden});
      est.setAttribute("data-t", j && j.ok && j.estado === "pagada" ? "p_sent" : "p_pend");
    }catch(e){ est.setAttribute("data-t", "p_pend"); }
    est.textContent = T[LANG][est.getAttribute("data-t")];
  } else {
    h1.setAttribute("data-t","h_bad"); h1.textContent = T[LANG].h_bad;
    document.getElementById("badOrden").textContent = orden;
    document.getElementById("badDesc").textContent = desc || "—";
    document.getElementById("badBox").hidden = false;
    document.getElementById("retryBtn").addEventListener("click", () => { document.getElementById("retryForm").hidden = false; document.getElementById("retryMail").focus(); });
    document.getElementById("retryGo").addEventListener("click", async () => {
      const mail = document.getElementById("retryMail").value.trim(), err = document.getElementById("retryErr");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return;
      err.hidden = true;
      try{
        const j = await llamar({accion:"pagar", orden: orden, correo: mail});
        if(j && j.ok && j.pagoUrl){ location.href = j.pagoUrl; return; }
      }catch(e){}
      err.hidden = false;
    });
  }
})();
</script>

</body>
</html>
